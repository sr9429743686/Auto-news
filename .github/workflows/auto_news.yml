name: MarketMunafa Auto News Bot

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run News Bot
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          MAX_POSTS_PER_RUN: "3"
          DAILY_MAX_POSTS: "20"
        run: python news_bot.py

      - name: Save posted history
        run: |
          git config --global user.name "MarketMunafa Bot"
          git config --global user.email "bot@marketmunafa.local"
          git add thumbnails/ posted_urls.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update posted news history"
          git push || true
